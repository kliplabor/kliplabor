<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Új jelszó – KlipLabor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090B">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#tartalom">Ugrás a tartalomra</a>

<header class="nav-shell">
  <nav class="nav" aria-label="Fő navigáció">
    <a href="index.html" class="brand" aria-label="KlipLabor – főoldal">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M24 8h16" stroke="#C6F432" stroke-width="5" stroke-linecap="round"/><path d="M27 8v16L13 49a4 4 0 0 0 3.5 6h31a4 4 0 0 0 3.5-6L37 24V8" stroke="#C6F432" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 36v13l11-6.5z" fill="#C6F432"/></svg>
      <span class="brand-name">KlipLabor</span>
    </a>
    <div class="nav-right">
      <a class="nav-link" href="belepes.html">Belépés</a>
    </div>
  </nav>
</header>

<main id="tartalom" class="wrap wrap-narrow auth-main">
  <p class="eyebrow">Fiók</p>
  <h1 class="h-page">Új jelszó</h1>

  <div class="card auth-card">
    <p id="pw-loading" class="loading" role="status" aria-live="polite">Link ellenőrzése…</p>

    <div id="pw-invalid" class="stack" hidden>
      <div id="pw-invalid-msg" class="msg msg-err" role="alert"></div>
      <a class="btn btn-ghost" href="belepes.html#elfelejtett">Új link kérése</a>
    </div>

    <form id="pw-form" class="form" novalidate hidden>
      <div class="fld">
        <label for="pw-new">Új jelszó</label>
        <input class="input" id="pw-new" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint">
        <p class="hint" id="pw-hint">Legalább 8 karakter.</p>
      </div>
      <div class="fld">
        <label for="pw-again">Új jelszó még egyszer</label>
        <input class="input" id="pw-again" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div id="pw-msg" class="msg" role="status" aria-live="polite" hidden></div>
      <button class="btn btn-accent btn-block" type="submit">Jelszó mentése</button>
    </form>

    <div id="pw-done" class="stack" hidden>
      <div class="msg msg-ok" role="status">Az új jelszavad el van mentve.</div>
      <a class="btn btn-accent" href="clipper.html">Tovább a felületemre</a>
    </div>
  </div>
</main>

<footer class="wrap site-foot">
  <span class="foot-brand">KlipLabor</span>
  <div class="foot-links">
    <a href="szabalyzat.html">Szabályzat</a>
    <a href="adatvedelem.html">Adatvédelem</a>
  </div>
  <span>© 2026 KlipLabor</span>
</footer>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var KL = window.KL, $ = KL.$;
  var linkError = KL.hashError();
  function invalid(text) {
    $('#pw-loading').hidden = true;
    $('#pw-form').hidden = true;
    $('#pw-invalid-msg').textContent = text;
    $('#pw-invalid').hidden = false;
  }
  var sb = KL.client();
  if (!sb) { invalid(KL.NO_CLIENT); return; }
  if (linkError) { invalid(linkError); return; }

  // A Supabase a linkből automatikusan munkamenetet hoz létre (PASSWORD_RECOVERY esemény).
  KL.getSession().then(function (s) {
    $('#pw-loading').hidden = true;
    if (!s) { invalid('Ez a link lejárt vagy már felhasználták. Kérj újat.'); return; }
    $('#pw-form').hidden = false;
    $('#pw-new').focus();
  }).catch(function (err) { invalid(KL.errorText(err)); });

  $('#pw-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('#pw-msg'), a = $('#pw-new'), b = $('#pw-again');
    a.removeAttribute('aria-invalid'); b.removeAttribute('aria-invalid');
    if (a.value.length < 8) { a.setAttribute('aria-invalid', 'true'); KL.say(msg, 'A jelszó legalább 8 karakter legyen.', 'err'); a.focus(); return; }
    if (a.value !== b.value) { b.setAttribute('aria-invalid', 'true'); KL.say(msg, 'A két jelszó nem egyezik.', 'err'); b.focus(); return; }
    var btn = e.submitter || $('#pw-form button[type="submit"]');
    KL.busy(btn, true, 'Mentés…');
    sb.auth.updateUser({ password: a.value }).then(function (res) {
      if (res.error) { throw res.error; }
      $('#pw-form').hidden = true;
      $('#pw-done').hidden = false;
    }).catch(function (err) {
      KL.busy(btn, false);
      KL.say(msg, KL.errorText(err), 'err');
    });
  });
})();
</script>
</body>
</html>
